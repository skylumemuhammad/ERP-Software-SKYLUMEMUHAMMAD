{% extends "base.html" %}

{% block title %}{{ action }} Account{% endblock %}

{% block content %}
<h2>{{ action }} Account</h2>
<form method="post">
    <div class="mb-3">
        <label>Account Number (Code)</label>
        <input type="text" name="code" value="{{ account.code if account else '' }}" class="form-control" {% if action == 'Edit' %}readonly{% endif %} required>
    </div>
    <div class="mb-3">
        <label>Account Head Name</label>
        <input type="text" name="name" value="{{ account.name if account else '' }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <div class="form-check">
            <input type="checkbox" name="is_group" id="is_group" class="form-check-input" {% if account and account.is_group %}checked{% endif %}>
            <label class="form-check-label" for="is_group">Group Account (can have child accounts)</label>
        </div>
    </div>
    <div class="mb-3">
        <label>Parent Account (only Group accounts shown)</label>
        <select name="parent" class="form-control">
            <option value="">Root Level (No Parent)</option>
            {% for acc in group_accounts %}
            <option value="{{ acc.code }}" {% if account and account.parent == acc.code %}selected{% endif %}>
                {{ acc.code }} - {{ acc.name }}
            </option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">{{ action }}</button>
    <a href="/chart/" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
